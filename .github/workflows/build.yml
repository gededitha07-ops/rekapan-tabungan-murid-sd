

name: Build APK Tabungan Murid SD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Check AndroidManifest
        run: |
          echo "=== Lokasi file ==="
          ls -la app/src/main/
          echo "=== Isi AndroidManifest.xml ==="
          cat -n app/src/main/AndroidManifest.xml
          echo "=== Pemeriksaan XML ==="
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          xmllint --noout app/src/main/AndroidManifest.xml

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tabungan-Murid-SD
          path: app/build/outputs/apk/debug/app-debug.apk
